<script>
(function () {
  const PCOLORS = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)"];
  const CAT_COLORS = { history: "#8a5a3c", present: "#3d6f8e", fiction: "#6b4f8a", music: "#9a4a78", sports: "#2f7a4f", science: "#2f5f8a", politics: "#5a5a7a", art: "#8a6a3c", folklore: "#7a6a2a", religion: "#7a6a2a", business: "#3d6f8e", literature: "#6b4f8a", film: "#2f2f3a", tv: "#466b54", anime: "#c0504d", cartoon: "#d08a2e", comics: "#a8323a", mythology: "#7a6a2a", games: "#2f6b7a" };
  const app = document.getElementById("app");

  // ---------- data ----------
  let DATA = {
    characters: normChars(JSON.parse(document.getElementById("seed-characters").textContent)),
    challenges: JSON.parse(document.getElementById("seed-challenges").textContent)
  };
  function normChars(j) {
    const arr = Array.isArray(j) ? j : (j && j.characters) || [];
    return arr.filter(c => c && c.id && c.name).map(c => ({ ...c, filter: String(c.group || c.category || "other").toLowerCase(), category: c.category || c.group || "" }));
  }
  function applyImages(m) {
    if (!m || typeof m !== "object") return;
    const map = m.images && typeof m.images === "object" ? m.images : m;
    DATA.characters.forEach(c => {
      if (c.image) return;
      let v = map[c.id]; if (!v) return;
      if (typeof v === "object") v = v.file || v.path || v.src || v.image || "";
      if (typeof v !== "string" || !v) return;
      c.image = /^(data:|images\/)/.test(v) ? v : "images/" + v.replace(/^\.?\//, "");
    });
  }
  let dataSource = "file";
  const IMG = JSON.parse(document.getElementById("img-index").textContent);
  const imgCache = {}, packLoads = {};
  function ensureImages(ids) {
    const need = [...new Set((ids || []).map(id => IMG.packs[id]).filter(n => n != null && !packLoads[n]))];
    need.forEach(n => {
      packLoads[n] = fetch(`imgpacks/pack-${n}.json`).then(r => r.ok ? r.json() : {}).then(j => {
        Object.assign(imgCache, j);
        if (S.phase !== "setup" && !flash) render();
      }).catch(() => {});
    });
  }
  async function loadData() {
    // Published data files (characters.json / challenges.json beside the page) replace the built-in sample.
    try {
      const [c, h] = await Promise.all([fetch("characters.json"), fetch("challenges.json")]);
      if (c.ok) { const n = normChars(await c.json()); if (n.length) DATA.characters = n; }
      if (h.ok) { const j = await h.json(); if (Array.isArray(j.challenges) && j.challenges.length) DATA.challenges = j; }
      const im = await fetch("images/manifest.json"); if (im.ok) applyImages(await im.json());
    } catch (e) { /* keep sample */ }
  }
  const charById = id => DATA.characters.find(c => c.id === id) || { id, name: id, description: "", talents: [] };
  const categories = () => [...new Set(DATA.characters.map(c => c.filter).filter(Boolean))].sort();

  // ---------- state ----------
  const defaultSetup = () => ({ names: ["Player 1", "Player 2", "", ""], budget: 50, teamSize: 3, poolPer: 4, cats: [], fame: 2 });
  let S = { phase: "setup", setup: defaultSetup() };
  let undoStack = [];
  let flash = null; // transient "SOLD" stamp
  let confirmReset = false;

  const clone = o => JSON.parse(JSON.stringify(o));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const initials = n => String(n).split(/\s+/).filter(w => /^[A-Za-z0-9]/.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
  const catColor = c => CAT_COLORS[String(c || "").toLowerCase().split(/[\s/]/)[0]] || "#5b6b62";

  function startGame() {
    const st = S.setup;
    const humans = st.names.map(n => n.trim()).filter(Boolean);
    const names = humans.concat(BOT_NAMES.slice(0, botCount(humans.length)));
    let pool = DATA.characters;
    if (st.cats.length) pool = pool.filter(c => st.cats.includes(c.filter));
    pool = pool.filter(c => !c.fame_tier || c.fame_tier <= (st.fame || 3));
    const need = names.length * Number(st.poolPer);
    const lots = shuffle(pool).slice(0, need).map(c => c.id);
    S = {
      phase: "auction", setup: st, round: (S.round || 0),
      players: names.map((n, i) => ({ name: n, color: PCOLORS[i], money: Number(st.budget), team: [], wins: S.players?.[i]?.name === n ? S.players[i].wins : 0 })),
      lots, lotIndex: 0, unsold: [], bid: null, log: S.log || []
    };
    S.players.forEach((p, i) => { p.bot = i >= humans.length; });
    S.live = false; S.ready = S.players.map(p => !!p.bot); S.endsAt = null; brain = { key: null };
    undoStack = [];
  }

  const slotsLeft = p => p.money > 0 ? 1 : 0; // no team size cap: you can keep buying while you have money
  const maxBid = p => Math.max(0, p.money); // keep $1 for every other empty seat
  const currentLot = () => S.lots[S.lotIndex];
  const auctionOver = () => S.players.every(p => slotsLeft(p) <= 0) || S.lotIndex >= S.lots.length;

  function placeBid(pi, amount) {
    if (S.live === false || flash) return;
    undoStack.push(clone(S));
    S.bid = { amount, bidder: pi };
    if (S.endsAt && S.endsAt - Date.now() < BUMP_MS) S.endsAt = Date.now() + BUMP_MS; // late bid: clock back to 5s
    render();
  }
  function hammer() {
    if (flash || S.live === false) return;
    undoStack.push(clone(S));
    S.endsAt = null;
    const id = currentLot();
    if (S.bid) {
      const p = S.players[S.bid.bidder];
      p.money -= S.bid.amount;
      p.team.push({ id, paid: S.bid.amount });
      flash = { text: "SOLD", id, bidder: S.bid.bidder, amt: S.bid.amount };
    } else {
      S.unsold.push(id);
      flash = { text: "PASSED", id };
    }
    render();
    setTimeout(() => { flash = null; S.bid = null; S.lotIndex++; S.endsAt = auctionOver() ? null : Date.now() + LOT_MS; render(); }, reduceMotion() ? 700 : (S.bid ? 2400 : 1100));
  }
  function undo() { if (undoStack.length && !flash) { S = undoStack.pop(); if (S.phase === "auction" && S.live !== false && !auctionOver()) S.endsAt = Date.now() + LOT_MS; render(); } }
  function reAuctionUnsold() { undoStack.push(clone(S)); S.lots = S.lots.concat(shuffle(S.unsold)); S.unsold = []; S.endsAt = Date.now() + LOT_MS; render(); }

  let deck = null;
  const DIFF = { 1: "Everyday", 2: "Skilled", 3: "Hard", 4: "Epic", 5: "Legendary" };
  function drawChallenge(kind) {
    S.vote = newVote();
    if (window.ChallengeGen && window.CHALLENGE_DATA) {
      try {
        deck = deck || window.ChallengeGen.createDeck(window.CHALLENGE_DATA);
        const f = {}; if (S.diffPref) f.difficulty = S.diffPref; if (kind === "mix") f.source = "generated";
        const d = deck.draw(f);
        const cats = Object.fromEntries((deck.categories || []).map(c => [c.id, c.label]));
        const cat = d.source === "generated" ? "Random mash-up" : d.source === "occupation" ? (d.occupation ? "Job: " + d.occupation : "Job") : (cats[d.category] || d.category);
        S.challenge = { id: d.id || "gen-" + Date.now(), title: d.text, category: cat, difficulty: d.difficulty, description: "" };
        S.winner = undefined; return;
      } catch (e) { /* fall back to built-in list */ }
    }
    const ch = DATA.challenges;
    if (kind === "mix" && ch.verbs?.length && ch.nouns?.length) {
      const verb = pick(ch.verbs), noun = pick(ch.nouns);
      S.challenge = { id: "mix", title: `${verb} ${noun}`, category: "mash-up", difficulty: 0, description: "A freshly mixed challenge. Argue it out." };
    } else {
      const list = ch.challenges.filter(c => c.id !== S.challenge?.id);
      S.challenge = pick(list.length ? list : ch.challenges);
    }
    S.winner = undefined;
  }
  function toChallenge() { S.phase = "challenge"; S.round = (S.round || 0) + 1; drawChallenge("list"); render(); }
  function award(pi) {
    S.winner = pi;
    if (pi !== null) S.players[pi].wins++;
    S.log.unshift(`Round ${S.round}: ${S.challenge.title} — ${pi === null ? "no winner" : S.players[pi].name + " won"}`);
    render();
  }
  function nextChallenge() { S.round++; drawChallenge("list"); render(); }

  // ---------- views ----------
  const gavelSvg = `<svg class="gavel" viewBox="0 0 64 64" aria-hidden="true"><g fill="var(--brass)"><rect x="18" y="8" width="30" height="14" rx="3" transform="rotate(35 33 15)"/><rect x="29" y="22" width="7" height="34" rx="3" transform="rotate(35 32 39)" opacity=".85"/><rect x="6" y="54" width="30" height="6" rx="2" opacity=".6"/></g></svg>`;

  // ---------- card style by kind of character (cardstyle.py) ----------
  const CS_STAR = new Set(["musician", "musicians", "actor", "actress", "actress/inventor", "comedian", "director", "singer", "rapper", "band"]);
  const CS_AUTHOR = new Set(["writer", "playwright", "folklorists", "poet", "novelist", "author"]);
  const CS_AUTHOR_IDS = new Set(["sappho", "omar-khayyam", "rumi"]);
  function csDeathYear(c) {
    const o = String(c.origin || "").trim();
    if (!o || /^born/i.test(o)) return null;
    const parts = o.split(/\s[\u2013-]\s/);
    const last = parts[parts.length - 1];
    const m = last.match(/\d{3,4}/) || last.match(/\d+/);
    if (/\bBC\b/.test(last)) return m ? -Number(m[0]) : -1000;
    return m ? Number(m[0]) : -1000;
  }
  function cardStyle(c) {
    if (!c) return "";
    if (c.card_style) return c.card_style === "plain" ? "" : c.card_style;
    const cat = String(c.category || "").toLowerCase(), grp = String(c.group || c.filter || "").toLowerCase(), src = String(c.source || "").toLowerCase();
    if (grp === "fiction") {
      if (/cartoon|anime|comic|manga/.test(cat)) return "toon";
      if (/literature|book|novel/.test(cat)) return "paint";
      return "";
    }
    if (CS_STAR.has(src)) return "star";
    if (CS_AUTHOR.has(src) || CS_AUTHOR_IDS.has(c.id)) return "paint";
    if (grp === "history") { const y = csDeathYear(c); if (y !== null && y <= 1950) return "sepia"; }
    return "";
  }
  function csTone(c) { let h = 0; for (const ch of String(c && c.id || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 6; }

  function art(c, big) {
    const bg = catColor(c.category);
    const src = c.image || imgCache[c.id];
    const img = src ? `<img src="${esc(src)}" alt="${esc(c.name)}" loading="lazy" onerror="this.remove()">` : "";
    return big
      ? `<div class="art" style="background:${bg}"><span class="mono">${esc(initials(c.name))}</span>${img ? `<div style="position:absolute;inset:0">${img}</div>` : ""}${c.category ? `<span class="cat">${esc(c.category)}</span>` : ""}</div>`
      : `<div class="thumb" data-cs="${cardStyle(c)}" style="background:${bg}">${img || esc(initials(c.name))}</div>`;
  }
  function charCard(c, extra = "") {
    return `<article class="card enter" data-cs="${cardStyle(c)}" data-tone="${csTone(c)}">
      ${art(c, true)}
      <div class="body">
        <h3>${esc(c.name)}</h3>
        ${c.origin || c.source ? `<div class="src">${esc(c.origin || c.source)}</div>` : ""}
        <p>${esc(c.description)}</p>
        ${IMG.credits[c.id] ? `<div class="credit">Photo: ${esc(IMG.credits[c.id])}</div>` : ""}
        ${c.talents?.length ? `<div class="chips">${c.talents.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : ""}
      </div>${extra}
    </article>`;
  }
  function teamsView(showPaid = true) {
    return `<section class="teams" aria-label="Teams">${S.players.map(p => `
      <div class="team" style="--pc:${p.color}">
        <div class="th"><h3>${esc(p.name)}</h3><span class="money">$${p.money}</span></div>
        ${p.wins ? `<div class="wins">${p.wins} challenge win${p.wins > 1 ? "s" : ""}</div>` : ""}
        <ul>
          ${p.team.map(m => { const c = charById(m.id); return `<li class="member">${art(c)}<div class="mi"><div class="mn">${esc(c.name)}</div><div class="ms">${esc((c.talents || []).slice(0, 3).join(", "))}</div></div>${showPaid ? `<span class="paid money">$${m.paid}</span>` : ""}</li>`; }).join("")}

  }
  function showcaseView() {
    return `<section class="showcase" aria-label="The teams">${S.players.map(p => {
      const spent = p.team.reduce((a, m) => a + m.paid, 0);

        <div class="sh"><h2>${esc(p.name)}</h2><span class="meta">${p.team.length} teammate${p.team.length === 1 ? "" : "s"} · spent $${spent} · $${p.money} left${p.wins ? ` · ${p.wins} win${p.wins > 1 ? "s" : ""}` : ""}</span></div>
        ${p.team.length ? `<div class="showcards">${p.team.map(m => charCard(charById(m.id), `<span class="pricetag">$${m.paid}</span>`).replace('class="card enter"', 'class="card" style="position:relative"')).join("")}</div>` : `<p class="hint">No teammates bought.</p>`}
      </div>`; }).join("")}</section>`;
  }
  function teamsPage() {
    return header("The armies are assembled") + `<div class="row"><button class="btn primary" data-act="to-challenge">Draw the challenge</button><button class="btn" data-act="back-auction">Back</button></div>` + showcaseView();
  }
  function header(tag) {
    return `<header class="top"><div class="brand">${gavelSvg}<div><h1>Character Army Builder</h1><div class="phase-tag">${tag}</div></div></div>
      <div class="row">${S.phase !== "setup" && NET.mode !== "guest" ? (confirmReset
        ? `<span class="confirm">End this game? <button class="btn small" data-act="reset-yes">End game</button><button class="btn small" data-act="reset-no">Keep playing</button></span>`
        : `<button class="btn small" data-act="reset">New game</button>`) : ""}</div></header>`;
  }

  function setupView() {
    const st = S.setup;
    const cats = categories();
    const nh = st.names.filter(x => x.trim()).length, nb = botCount(nh), n = nh + nb;
    const pool = DATA.characters.filter(c => (!st.cats.length || st.cats.includes(c.filter)) && (!c.fame_tier || c.fame_tier <= (st.fame || 3))).length;
    const need = n * st.poolPer;
    const ok = n >= 2 && pool >= 1 && st.budget >= 1;
    return header("Set the table") + `
    <div class="setup">
      ${NET.panel()}
      <section class="panel">
        <h2>${NET.mode ? "Players" : "Bidders"}</h2>
        <div class="players-list">
          ${st.names.map((nm, i) => `<div class="player-input"><span class="dot" style="background:${PCOLORS[i]}"></span>
            <input type="text" id="pname-${i}" data-name="${i}" value="${esc(nm)}" placeholder="${i < 2 ? "Player " + (i + 1) : "Player " + (i + 1) + " (optional)"}" maxlength="24" aria-label="Player ${i + 1} name"></div>`).join("")}
        </div>
        <div class="grid2">
          <div class="field"><label for="budget">Budget per player ($)</label><input type="number" id="budget" min="5" max="10000" value="${st.budget}"></div>
        </div>
        <div class="field"><label for="poolPer">Characters in the pool per player</label><input type="number" id="poolPer" min="1" max="12" value="${st.poolPer}"></div>
        ${cats.length > 1 ? `<div class="field"><label>Draw only from (leave all off for everything)</label><div class="chips">${cats.map(c => `<button type="button" class="btn small" data-cat="${esc(c)}" aria-pressed="${st.cats.includes(c)}" style="${st.cats.includes(c) ? "background:var(--brass);color:#231a06;border-color:var(--brass)" : ""}">${esc(c)}</button>`).join("")}</div></div>` : ""}
        <div class="field"><label>Bots ${4 - nh > 0 ? `(up to ${4 - nh})` : "(no seats left)"}</label><div class="chips">${[0, 1, 2, 3].map(v => `<button type="button" class="btn small" data-bots="${v}" aria-pressed="${(st.bots || 0) === v}" ${v > 4 - nh ? "disabled" : ""} style="${(st.bots || 0) === v ? "background:var(--brass);color:#231a06;border-color:var(--brass)" : ""}">${v ? v + " bot" + (v > 1 ? "s" : "") : "No bots"}</button>`).join("")}</div>${nb ? `<p class="hint">Bots fill the empty seats: ${BOT_NAMES.slice(0, nb).join(", ")}. Each one secretly decides how much it wants every character.</p>` : ""}</div>
        <div class="field"><label>How famous?</label><div class="chips">${[[1, "Household names"], [2, "Well known"], [3, "Deep cuts too"]].map(([v, l]) => `<button type="button" class="btn small" data-fame="${v}" aria-pressed="${(st.fame || 3) === v}" style="${(st.fame || 3) === v ? "background:var(--brass);color:#231a06;border-color:var(--brass)" : ""}">${l}</button>`).join("")}</div></div>
        <p class="hint">${n} bidder${n === 1 ? "" : "s"}, ${Math.min(need, pool)} characters go under the hammer from a pool of ${pool}.${!ok ? ` <strong style="color:var(--danger)">${n < 2 ? "Name at least two players." : pool < 1 ? "No characters match those filters." : "Budget must be at least $1."}</strong>` : ""}</p>
        <div class="row"><button class="btn primary" data-act="start" ${ok ? "" : "disabled"}>Open the auction</button></div>
      </section>
      <section class="panel rules">
        <h2>How it plays</h2>
        <ol>
          <li><strong>One lot at a time.</strong> A random character is revealed and goes up for auction. The pool holds 4 characters per player, so not everyone gets their first pick.</li>
          <li><strong>Buzz in any time.</strong> No turns. The moment a character appears, anyone can hit their paddle. Every bid beats the last by at least $1; jump bids of $5, $10 or all in are allowed. On a keyboard, keys 1 to 4 buzz in +$1 for players 1 to 4. There is no team size limit: buy as many characters as your money allows.</li>
          <li><strong>Beat the clock.</strong> Each character gets 20 seconds. A bid in the last 5 seconds puts the clock back to 5. When time runs out the top bidder pays and takes the character; no bids means it passes.</li>
          <li><strong>Playing online?</strong> Everyone sees the same auction on their own screen and bids with their own paddle. The host brings down the gavel and runs the challenge.</li>
          <li><strong>Face the challenge.</strong> When the last character is sold, a random challenge is drawn. Argue your case, then the table picks a winner.</li>
        </ol>
        <p class="datanote">Playing with ${DATA.characters.length} characters from the roster and ${window.CHALLENGE_DATA ? `${window.CHALLENGE_DATA.curated.challenges.length} hand-written challenges, ${window.CHALLENGE_DATA.occupations.occupations.length} jobs and a mash-up generator with thousands of combinations` : DATA.challenges.challenges.length + " challenges"}.</p>
      </section>
    </div>`;
  }

  function auctionView() {
    if (auctionOver() && !flash) {
      const incomplete = S.unsold.length > 0 && S.players.some(p => p.money > 0);
      return header("Auction closed") + `
        <section class="panel">
          <h2>${S.players.every(p => p.money <= 0) ? "Everyone is out of money" : "Every character has been auctioned"}</h2>
          <p class="hint">${incomplete ? `Some characters went unsold.${S.unsold.length ? ` ${S.unsold.length} passed character${S.unsold.length > 1 ? "s" : ""} can go back up for auction.` : ""}` : "Time to see what these armies can do."}</p>
          <div class="row">
            ${incomplete && S.unsold.length ? `<button class="btn" data-act="reauction">Re-auction passed characters</button>` : ""}
            <button class="btn primary" data-act="to-challenge">Draw the challenge</button>
            <button class="btn" data-act="view-teams">See the teams</button>
            <button class="btn" data-act="undo" ${undoStack.length ? "" : "disabled"}>Undo last action</button>
          </div>
        </section>` + teamsView();
    }
    const c = charById(currentLot());
    const remaining = S.lots.length - S.lotIndex;
    const stamp = flash && flash.id === c.id ? `<div class="stamp"><span>${flash.text}</span>${flash.text === "SOLD" && S.players[flash.bidder] ? `<em class="soldto" style="--pc:${S.players[flash.bidder].color}">${esc(S.players[flash.bidder].name)} gets ${esc(c.name)} for $${flash.amt}!</em>` : ""}</div>` : "";
    const leader = S.bid ? S.players[S.bid.bidder] : null;
    const cur = S.bid ? S.bid.amount : 0;
    const paddles = S.players.map((p, i) => {
      const mx = maxBid(p), full = slotsLeft(p) <= 0, lead = S.bid?.bidder === i;
      const opts = [1, 5, 10].map(inc => ({ label: `+${inc}`, amt: cur + inc }));
      opts.push({ label: "All in", amt: mx });
      return `<div class="paddle ${lead ? "leading" : ""} ${full ? "out" : ""}" style="--pc:${p.color}">
        <div class="ph"><span class="name"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.bot ? `<span class="bottag">bot</span>` : ""}</span><span class="money">$${p.money}</span></div>
        <div class="stat">${full ? "Out of money" : `${p.team.length} on the team · key ${i + 1}`}</div>
        <div class="bids">${opts.map(o => `<button data-bid="${i}" data-amt="${o.amt}" ${S.live === false || p.bot || full || lead || flash || o.amt > mx || o.amt <= cur ? "disabled" : ""} aria-label="${esc(p.name)} bids $${o.amt}">${o.label === "All in" ? "All" : o.label}</button>`).join("")}</div>
      </div>`;
    }).join("");
    return header(`Lot ${S.lotIndex + 1} of ${S.lots.length}`) + `
      <div class="auction">
        <div class="lotcol">
          <div class="lotmeta"><span class="lotno">Character ${S.lotIndex + 1} of ${S.lots.length}</span><span class="eyebrow">${remaining - 1 ? `${remaining - 1} left after this one` : "Last one!"}</span></div>
          <div class="lotdots" aria-hidden="true">${S.lots.map((id, j) => `<i class="${j < S.lotIndex ? "done" : j === S.lotIndex ? "now" : ""}"></i>`).join("")}</div>
          <div style="position:relative">${charCard(c)}${stamp}</div>
        </div>
        <div class="bidbox">
          ${timerHtml()}
          <div class="highbid">
            <div><div class="eyebrow">${leader ? "High bid" : "Opening bid"}</div><div class="amt money">$${cur || 0}</div></div>
            <div class="who" style="color:${leader ? leader.color : "var(--text-soft)"}">${leader ? esc(leader.name) : "No bids yet"}</div>
          </div>
          ${S.live === false ? readyView() : ""}<div class="paddles">${paddles}</div>
          <div class="gavelrow">
            <button class="btn primary" data-act="hammer" ${flash || S.live === false ? "disabled" : ""}>${leader ? `Sell now to ${esc(leader.name)} for $${cur}` : "No bids. Pass this lot now"}</button>
            <button class="btn" data-act="undo" ${undoStack.length && !flash ? "" : "disabled"}>Undo</button>
          </div>
        </div>
      </div>` + teamsView();
  }

  function challengeView() {
    const ch = S.challenge;
    const d = ch.difficulty || 0;
    const hasMix = DATA.challenges.verbs?.length && DATA.challenges.nouns?.length;
    const decided = S.winner !== undefined;
    return header(`Challenge round ${S.round}`) + `
      <section class="challenge-card" aria-live="polite">
        <span class="eyebrow">The challenge${ch.category ? " · " + esc(ch.category) : ""}</span>
        <h2>${esc(ch.title)}</h2>
        ${ch.description ? `<p>${esc(ch.description)}</p>` : ""}
        ${d ? `<div class="diff">${DIFF[d] || "Difficulty"} ${[1, 2, 3, 4, 5].map(i => `<i class="${i <= d ? "on" : ""}"></i>`).join("")}</div>` : ""}
      </section>
      ${!decided && (!S.vote || S.vote.stage === "argue") ? `<div class="row">
        <button class="btn small" data-act="redraw">Draw a different challenge</button>
        ${hasMix || window.ChallengeGen ? `<button class="btn small" data-act="mix">Mix up a random one</button>` : ""}
      </div>
      <div class="diffpick">Difficulty for the next draw:
        ${[0, 1, 2, 3, 4, 5].map(n => `<button class="btn small" data-diff="${n}" aria-pressed="${(S.diffPref || 0) === n}">${n ? DIFF[n] : "Any"}</button>`).join("")}
      </div>` : ""}
      <section class="panel verdict">
        ${decided
          ? `<div class="result-banner">${S.winner === null ? (S.vote?.result?.tied?.length > 1 ? "It's a tie between " + S.vote.result.tied.map(i => esc(S.players[i].name)).join(" and ") : "No winner this round") : esc(S.players[S.winner].name) + " takes the round"}</div>
             ${tallyView()}
             <div class="scoreboard">${S.players.map(p => `<span><span class="dot" style="background:${p.color}"></span>${esc(p.name)} <strong class="money">${p.wins}</strong></span>`).join("")}</div>
             <div class="row">
               <button class="btn primary" data-act="next-challenge">Next challenge, same teams</button>
               <button class="btn" data-act="rebid">New auction, keep scores</button>
             </div>
             ${S.log.length > 1 ? `<ol class="log">${S.log.map(l => `<li>${esc(l)}</li>`).join("")}</ol>` : ""}`
          : NET.mode ? voteView() : `<h2>Who pulls it off?</h2>
             <p class="hint">Each player makes the case for their team. Then the table decides.</p>
             <div class="row">${S.players.map((p, i) => `<button class="btn" style="--pc:${p.color};border-color:${p.color}" data-award="${i}">${esc(p.name)} wins</button>`).join("")}
               <button class="btn" data-award="none">Nobody could do it</button></div>`}
      </section>` + showcaseView();
  }

  function render() {
    if (S.phase !== "setup" && S.lots) ensureImages(S.lots);
    const focusId = document.activeElement?.id;
    const sel = document.activeElement?.selectionStart;
    app.innerHTML = S.phase === "setup" ? setupView() : S.phase === "auction" ? auctionView() : S.phase === "teams" ? teamsPage() : challengeView();
    NET.afterRender();
    celebrate(); tick();
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
  }

  // ---------- events ----------
  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.net) return NET.ui(b.dataset.net);
    if (b.dataset.pick) { pickLocal(b.dataset.pick); return render(); }
    const d = { ...b.dataset };
    if (NET.mode === "guest") { if (d.bid != null || d.ready != null || d.voteready != null || d.vote != null) NET.send(d); return; }
    act(d);
  });
  function act(d) {
    if (d.bid != null) {
      const pi = Number(d.bid), amt = Number(d.amt), p = S.players?.[pi];
      if (S.phase !== "auction" || flash || !p || auctionOver()) return;
      const cur = S.bid ? S.bid.amount : 0;
      if (p.bot || S.bid?.bidder === pi || !(amt > cur) || amt > maxBid(p)) return; // stale or invalid bid
      return placeBid(pi, amt);
    }
    if (d.ready != null) { setReady(d.ready); return render(); }
    if (d.bots != null) { S.setup.bots = Number(d.bots) || 0; return render(); }
    if (d.voteready != null) { setVoteReady(d.voteready); return render(); }
    if (d.vote != null) { castVote(Number(d.vote), Number(d.first), Number(d.second)); return render(); }
    if (d.cat) { const c = d.cat, cs = S.setup.cats; S.setup.cats = cs.includes(c) ? cs.filter(x => x !== c) : cs.concat(c); return render(); }
    if (d.fame) { S.setup.fame = Number(d.fame); return render(); }
    if (d.diff) { S.diffPref = Number(d.diff) || 0; return render(); }
    if (d.award) { if (S.winner !== undefined) return; return award(d.award === "none" ? null : Number(d.award)); }
    switch (d.act) {
      case "start": startGame(); break;
      case "hammer": return hammer();
      case "undo": return undo();
      case "reauction": reAuctionUnsold(); return;
      case "to-challenge": return toChallenge();
      case "countvotes": countVotes(); break;
      case "view-teams": S.phase = "teams"; break;
      case "back-auction": S.phase = "auction"; break;
      case "redraw": drawChallenge("list"); break;
      case "mix": drawChallenge("mix"); break;
      case "next-challenge": return nextChallenge();
      case "rebid": startGame(); break;
      case "reset": confirmReset = true; break;
      case "reset-no": confirmReset = false; break;
      case "reset-yes": confirmReset = false; S = { phase: "setup", setup: S.setup }; undoStack = []; break;
    }
    render();
  }
  app.addEventListener("input", e => {
    const t = e.target;
    if (NET.input(t)) return;
    if (t.dataset.name != null) { S.setup.names[Number(t.dataset.name)] = t.value; }
    else if (t.id === "budget") S.setup.budget = Math.max(1, parseInt(t.value) || 0);
    else if (t.id === "teamSize") S.setup.teamSize = Math.min(10, Math.max(1, parseInt(t.value) || 1));
    else if (t.id === "poolPer") S.setup.poolPer = Math.min(12, Math.max(1, parseInt(t.value) || 1));
    else return;
    // refresh only the validity hint and start button without stealing focus
    render();
  });
  document.addEventListener("keydown", e => {
    if (NET.mode) return NET.key(e);
    if ((e.ctrlKey || e.metaKey) && e.key === "z" && S.phase === "auction") { e.preventDefault(); undo(); return; }
    if (S.phase !== "auction" || flash || auctionOver() || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.matches && e.target.matches("input, select, textarea")) return;
    const k = Number(e.key);
    if (k >= 1 && k <= S.players.length) {
      const p = S.players[k - 1], cur = S.bid ? S.bid.amount : 0;
      if (!p.bot && S.bid?.bidder !== k - 1 && cur + 1 <= maxBid(p)) placeBid(k - 1, cur + 1);
    }
  });

      name = cleanName(name); code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!name) return fail("Type your name first, then press Join.");
      if (code.length < 4) return fail("Type the room code your host sent you.");
      N.me = name; N.joinCode = code; N.error = ""; N.status = "Connecting to room " + code + "…"; render();
      try { await lib(); } catch (e) { return fail(e.message); }
      if (!N.peer || N.peer.destroyed) {
        try { N.peer = await openPeer(); } catch (err) { return fail(niceErr(err)); }
        keepAlive(N.peer);
        N.peer.on("error", err => {
          if (err && err.type === "peer-unavailable") return lost("Couldn't find room " + N.joinCode + ". Check the code, and make sure the host still has the game open.");
          if (!N.joined) fail(niceErr(err));
        });
      }
      connect();
    }
    function connect() {
      const c = N.peer.connect(pid(N.joinCode), { serialization: "json", reliable: true });
      N.conn = c;
      let opened = false;
      const t = setTimeout(() => { if (!opened && N.conn === c) { try { c.close(); } catch (e) {} lost("Couldn't reach room " + N.joinCode + ". It may be that your networks can't connect directly; try another Wi-Fi or mobile data."); } }, 20000);
      c.on("open", () => {
        opened = true; clearTimeout(t); N.seen = Date.now(); c.send({ t: "hello", name: N.me });
        clearInterval(N.hb); N.hb = setInterval(() => { if (N.conn === c && Date.now() - N.seen > 10000) { clearInterval(N.hb); N.conn = null; try { c.close(); } catch (e) {} lost("Lost the connection to the host."); } }, 2000);
      });
      c.on("data", m => onHostMsg(m, c));
      c.on("close", () => { if (N.conn === c) lost("Lost the connection to the host."); });
      c.on("error", () => {});
    }
    function lost(msg) {
      if (N.mode !== "guest" && !N.joined) { N.conn = null; return fail(msg); }
      if (N.retries < 20) {
        N.retries++; N.status = "Connection lost. Reconnecting… (try " + N.retries + " of 20)"; render();
        clearTimeout(lost.t); lost.t = setTimeout(() => { if (N.mode === "guest" && N.peer && !N.peer.destroyed) connect(); }, 3000);
      } else { N.conn = null; N.status = ""; N.error = "The host seems to have left. Leave the room and join again when they're back."; render(); }
    }
    function onHostMsg(m, c) {
      if (!m || typeof m !== "object" || N.conn !== c) return;
      N.seen = Date.now();
      if (m.t === "ping") { try { c.send({ t: "pong" }); } catch (e) {} return; }
      if (m.t === "state") {
        N.mode = "guest"; N.joined = true; N.retries = 0; N.status = ""; N.error = "";
        S = m.S; flash = m.flash; S.endsAt = m.endsIn != null ? Date.now() + m.endsIn : null; undoStack = m.canUndo ? [null] : []; confirmReset = false;
        N.lobby = m.lobby || []; N.seat = m.you; N.code = m.code;
        ss.set("cab-guest", { code: N.code, me: N.me }); setUrl(N.code);
        render();
      } else if (m.t === "full") { leave(true); fail("That room already has 4 players."); }
      else if (m.t === "nomatch") { leave(true); fail(m.names && m.names.length ? "That game has already started. To get back in, join with the name you used before: " + m.names.join(" or ") + "." : "That game has already started and every seat is taken."); }
    }

    // ----- shared -----
    function send(d) {
      if (N.mode === "host") return act(d);
      if (N.mode === "guest" && N.conn && N.conn.open) try { N.conn.send({ t: "act", d }); } catch (e) {}
    }
    function leave(quiet) {
      const wasHost = N.mode === "host";
      clearTimeout(lost.t); clearInterval(N.hb);
      try { N.conn && N.conn.close(); } catch (e) {}
      try { N.lobby.forEach(l => l.conn && l.conn.close()); } catch (e) {}
      try { N.peer && N.peer.destroy(); } catch (e) {}
      Object.assign(N, { mode: null, code: "", seat: 0, status: "", error: "", lobby: [], peer: null, conn: null, joined: false, retries: 0, joinCode: "" });
      ss.del("cab-host"); ss.del("cab-guest"); setUrl("");
      const keep = S.setup || defaultSetup();
      S = { phase: "setup", setup: wasHost ? keep : defaultSetup() }; flash = null; undoStack = [];
      if (!quiet) render();
    }
    function link() { return location.origin + location.pathname + "?room=" + N.code + keepPeer(); }
    function ui(what) {
      const nm = document.getElementById("netname"), cd = document.getElementById("netcode");
      if (nm) N.me = nm.value; if (cd) N.joinCode = cd.value;
      if (what === "host") return host(N.me);
      if (what === "join") return join(N.me, N.joinCode);
      if (what === "leave") return leave();
      if (what === "copy") {
        const done = () => { N.status = "Link copied. Paste it to your friends."; render(); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link()).then(done, () => { const el = document.getElementById("sharelink"); if (el) { el.select(); } });
        else { const el = document.getElementById("sharelink"); if (el) el.select(); }
        return;
      }
      if (what === "share" && navigator.share) navigator.share({ title: "Character Army Builder", text: "Join my game. Room code " + N.code, url: link() }).catch(() => {});
    }
    function input(t) {
      if (t.id === "netname") { N.me = t.value; return true; }
      if (t.id === "netcode") { N.joinCode = t.value; return true; }
      return t.id === "sharelink";
    }
    function key(e) {
      if (e.target.matches && e.target.matches("input, select, textarea")) return;
      if (N.mode === "host" && (e.ctrlKey || e.metaKey) && e.key === "z" && S.phase === "auction") { e.preventDefault(); undo(); return; }
      if (S.phase !== "auction" || flash || auctionOver() || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === " " || Number(e.key) === N.seat + 1) {
        const p = S.players[N.seat]; if (!p) return;
        e.preventDefault();
        const cur = S.bid ? S.bid.amount : 0;
        if (S.bid?.bidder !== N.seat && cur + 1 <= maxBid(p)) send({ bid: String(N.seat), amt: String(cur + 1) });
      }
    }
    function panel() {
      const err = N.error ? `<p class="neterr" role="alert">${esc(N.error)}</p>` : "";
      const st = N.status ? `<p class="hint netstatus" aria-live="polite">${esc(N.status)}</p>` : "";
      if (N.mode) {
        return `<section class="panel online">
          <h2>Online room <span class="roomcode">${esc(N.code)}</span></h2>
          ${N.mode === "host"
            ? `<p class="hint">Send your friends this link, or have them open the game and type the code <strong>${esc(N.code)}</strong>. Up to 4 players, each on their own device. Keep this page open: your browser runs the game.</p>
               <div class="sharerow"><input type="text" id="sharelink" readonly value="${esc(link())}" aria-label="Invite link" onclick="this.select()"><button class="btn small primary" data-net="copy">Copy link</button>${navigator.share ? `<button class="btn small" data-net="share">Share</button>` : ""}</div>`
            : `<p class="hint">You're in. ${esc(N.lobby[0]?.name || "The host")} picks the settings and opens the auction.</p>`}
          <ul class="lobby">${N.lobby.map((l, i) => `<li><span class="dot" style="background:${PCOLORS[i]}"></span><span>${esc(l.name)}</span>${i === 0 ? `<span class="tag">host</span>` : ""}${i === N.seat ? `<span class="tag">you</span>` : ""}${l.online ? "" : `<span class="tag away">away</span>`}</li>`).join("")}
            ${N.mode === "host" && N.lobby.length < 2 ? `<li class="waiting">Waiting for friends to join…</li>` : ""}</ul>
          ${st}${err}
          <div class="row"><button class="btn small" data-net="leave">${N.mode === "host" ? "Close the room" : "Leave the room"}</button></div>
        </section>`;
      }
      const joining = !!N.joinCode;
      return `<section class="panel online">
        <h2>Play online</h2>
        <p class="hint">${joining ? `You've been invited to room <strong>${esc(N.joinCode)}</strong>. Type your name and press Join.` : "Friends in different places? One person hosts and sends a link. Everyone plays on their own phone or computer."}</p>
        <div class="netform">
          <div class="field"><label for="netname">Your name</label><input type="text" id="netname" maxlength="24" value="${esc(N.me)}" placeholder="Your name" autocomplete="nickname"></div>
          <div class="field"><label for="netcode">Room code</label><input type="text" id="netcode" maxlength="8" value="${esc(N.joinCode)}" placeholder="e.g. K7QXM" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
        </div>
        <div class="row">
          <button class="btn ${joining ? "primary" : ""}" data-net="join">Join a room</button>
          <button class="btn ${joining ? "" : "primary"}" data-net="host">Host a new game</button>
        </div>
        ${st}${err}
        <p class="hint">All in one room? Skip this and fill in the bidders below to play on one device.</p>
      </section>`;
    }
    function bar() {
      if (!N.mode || S.phase === "setup") return "";
      const me = N.lobby[N.seat]?.name || N.me;
      const away = N.lobby.filter(l => !l.online).map(l => l.name);
      return `<div class="netbar" role="status"><span>Room <strong>${esc(N.code)}</strong></span><span>You're <strong>${esc(me)}</strong>${N.mode === "host" ? " (host)" : ""}</span>
        ${away.length ? `<span class="away">${esc(away.join(", "))} ${away.length > 1 ? "are" : "is"} away${N.mode === "host" ? ". They can rejoin with the same name." : ""}</span>` : ""}
        ${N.status ? `<span class="away">${esc(N.status)}</span>` : ""}${N.error ? `<span class="neterr">${esc(N.error)}</span> <button class="btn small" data-net="leave">Leave</button>` : ""}
        ${N.mode === "guest" && S.phase === "auction" ? `<span class="hint">${esc(N.lobby[0]?.name || "The host")} runs the gavel. You bid with your own paddle (space bar bids +$1).</span>` : ""}</div>`;
    }
    function afterRender() {
      if (!N.mode) return;
      if (N.mode === "host") {
        if (S.phase === "setup") {
          const pruned = N.lobby.filter((l, i) => i === 0 || l.online);
          const names = [0, 1, 2, 3].map(i => pruned[i]?.name || "");
          if (pruned.length !== N.lobby.length || names.join("|") !== S.setup.names.join("|")) { N.lobby = pruned; S.setup.names = names; return render(); }
        }
        const base = { t: "state", S, flash, endsIn: S.endsAt ? S.endsAt - Date.now() : null, canUndo: undoStack.length > 0, lobby: N.lobby.map(l => ({ name: l.name, online: l.online })), code: N.code };
        N.lobby.forEach((l, i) => { if (i && l.conn && l.conn.open) try { l.conn.send({ ...base, you: i }); } catch (e) {} });
        ss.set("cab-host", { code: N.code, me: N.me, S, lobby: base.lobby });
      }
      app.querySelectorAll("input[data-name]").forEach(el => { el.disabled = true; });
      app.querySelectorAll("button[data-bid]").forEach(el => { if (Number(el.dataset.bid) !== N.seat) el.disabled = true; });
      if (N.mode === "guest") {
        app.querySelectorAll("button, input, select").forEach(el => {
          if (el.dataset.net || el.id === "sharelink" || el.dataset.bid != null || el.dataset.ready === String(N.seat) || el.dataset.mine) return;
          el.disabled = true;
        });
      }
      const pads = app.querySelectorAll(".paddle"); if (pads[N.seat]) pads[N.seat].classList.add("mine");
      const b = bar(); if (b) { const h = app.querySelector("header.top"); if (h) h.insertAdjacentHTML("afterend", b); }
      if (N.mode === "guest" && S.phase === "setup") {
        const btn = app.querySelector('[data-act="start"]'); if (btn) btn.textContent = "Waiting for " + (N.lobby[0]?.name || "the host") + " to open the auction";
      }
    }
    addEventListener("pagehide", () => { try { N.conn && N.conn.close(); N.lobby.forEach(l => l.conn && l.conn.close()); N.peer && N.peer.destroy(); } catch (e) {} });
    function boot() {
      const h = ss.get("cab-host");
      if (h && h.code && h.me) return host(h.me, h);
      const g = ss.get("cab-guest");
      if (g && g.code && g.me && (!N.joinCode || N.joinCode === g.code)) return join(g.me, g.code);
    }
    return { get mode() { return N.mode; }, get seat() { return N.seat; }, send, ui, input, key, panel, afterRender, boot };
  })();

  // ---------- boot ----------
  window.claude?.hot?.snapshot?.(() => ({ S, undoStack }));
  async function start(saved) {
    await loadData();
    if (saved && saved.S && saved.S.phase) { S = saved.S; undoStack = saved.undoStack || []; }
    render();
    NET.boot();
  }
  render();
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
